name: "Check Gersemi"
description: "Install gersemi via uv-tool and run gersemi --check"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
    - uses: astral-sh/setup-uv@v7
    - uses: surge-synthesizer/sst-githubactions/uv-tool@main
      with:
        tool: "gersemi"
        version: "0.26.0"
    - shell: pwsh
      run: |
        & gersemi --check .
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }
