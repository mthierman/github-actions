name: "Check Gersemi"
description: "Install gersemi via uv-tool and run gersemi --check"

runs:
  using: "composite"
  steps:
    - uses: surge-synthesizer/sst-githubactions/uv-tool@main
      with:
        tool: "gersemi"
        version: "0.26.0"
    - shell: pwsh
      run: |
        Write-Host "gersemi: v$((& gersemi --version).Trim())"
        & gersemi --check .
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }
