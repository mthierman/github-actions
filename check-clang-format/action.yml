name: "Check Clang Format"
description: "Install clang-format via uv-tool and verify formatting"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
    - uses: astral-sh/setup-uv@v7
    - uses: surge-synthesizer/sst-githubactions/uv-tool@main
      with:
        tool: "clang-format"
        version: "22.1.0"
    - shell: pwsh
      run: |
        Write-Host "clang-format: v$((& clang-format --version).Trim())"
        $extensions = @(".cpp", ".hpp", ".cc", ".cxx", ".h", ".c", ".m", ".mm")
        $files = Get-ChildItem -Path . -Recurse -File | Where-Object { $extensions -contains $_.Extension.ToLowerInvariant() }
        if ($files.Count -eq 0) {
          Write-Host "No matching source files found."
          exit 0
        }

        foreach ($file in $files) {
          & clang-format -style=file --dry-run --Werror $file.FullName
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        }
