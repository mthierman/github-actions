name: Notify web

description: Notify mthierman.pages.dev

inputs:
  event_type:
    description: "Type of event"
    required: true
  name:
    description: "Name of project"
    required: true
  version:
    description: "Version of build"
    required: true
  description:
    description: "Description of project"
    required: true
  symbol:
    description: "Project symbol"
    required: true
  repo:
    description: "URL of git repository"
    required: true
  releases:
    description: "URL of releases"
    required: true

runs:
  using: node24
  main: dist/index.cjs
